[project]
name = "td-one-mortgage-agent"
version = "0.1.0"
description = "TD-One Agentic Mortgage Renewal Attrition Forecasting System (Vector Bootcamp)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "duckdb>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
tsfm = [
    "chronos-forecasting>=1.0.0",
    "timesfm>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/td_one"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "BLE"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
